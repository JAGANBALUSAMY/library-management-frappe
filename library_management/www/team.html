<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
</head>

<body>

    <h1>{{ title }}</h1>

    <ul>
        {% for user in users %}
        <li>
            <strong>{{ user.full_name }}</strong>
            - {{ user.email }}
        </li>
        {% endfor %}
    </ul>

</body>
</html>
